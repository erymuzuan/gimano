org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Gimano app configuration (override per build with -P<key>=<value>) ---
# Backend base URL (default: backend in Docker on WS556 over Tailscale; emulator host is 10.0.2.2).
# Physical device on the LAN: ./gradlew installDebug -Pgimano.apiBaseUrl=http://192.168.x.y:5080/api/v1/
gimano.apiBaseUrl=http://100.101.150.9:5080/api/v1/
# MapLibre style JSON URL.
gimano.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
# Start in demo mode (fake data, simulated drive). Can also be toggled in Settings.
gimano.demoMode=false
