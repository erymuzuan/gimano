[package]
name = "manotu-desktop"
description = "Manotu Desktop: private event and route planning"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "manotu-desktop"

[lib]
name = "manotu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
event-core = { path = "../crates/event-core" }
route-core = { path = "../crates/route-core" }
local-store = { path = "../crates/local-store" }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-clipboard-manager.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["clock"] }
zeroize.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync"] }
