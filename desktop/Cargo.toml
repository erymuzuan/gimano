[workspace]
members = ["crates/event-core", "crates/route-core", "crates/local-store", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
base64 = "=0.22.1"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
getrandom = { version = "=0.2.17", features = ["std"] }
zeroize = "=1.9.1"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "=1.53.3", default-features = false }
# Desktop app (local-store + src-tauri).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# keyring 3.x needs explicit native stores; without features it silently uses a mock store.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tauri = { version = "=2.12.4", features = [] }
tauri-build = { version = "=2.7.3", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"

# Argon2id with 64 MiB takes seconds unoptimised; keep unlock fast in debug builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
