<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="Helvetica Neue,Arial,sans-serif" role="img" aria-label="Encrypted files move between devices through a chosen messenger"><title>Encrypted files move between devices through a chosen messenger</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#536047"/></marker></defs><rect x="30.0" y="30" width="270" height="105" rx="12" fill="#edf0e7"/><text x="48.0" y="60" font-size="13" fill="#536047">01</text><text x="48.0" y="86" font-size="19" fill="#20251e">Organizer’s phone</text><text x="48.0" y="112" font-size="13" fill="#484e43">Create → encrypt → sign</text><path d="M303.0 82H360.0" stroke="#536047" marker-end="url(#arrow)"/><rect x="365.0" y="30" width="270" height="105" rx="12" fill="#f6eadc"/><text x="383.0" y="60" font-size="13" fill="#536047">02</text><text x="383.0" y="86" font-size="19" fill="#20251e">Your chosen channel</text><text x="383.0" y="112" font-size="13" fill="#484e43">Carries encrypted files</text><path d="M638.0 82H695.0" stroke="#536047" marker-end="url(#arrow)"/><rect x="700.0" y="30" width="270" height="105" rx="12" fill="#edf0e7"/><text x="718.0" y="60" font-size="13" fill="#536047">03</text><text x="718.0" y="86" font-size="19" fill="#20251e">Guest’s phone</text><text x="718.0" y="112" font-size="13" fill="#484e43">Verify → decrypt → store</text><text x="30" y="178" font-size="16" fill="#595959">Manotu servers are outside this content path. The channel still sees its own users and traffic.</text></svg>