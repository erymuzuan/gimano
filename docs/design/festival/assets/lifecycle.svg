<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="Helvetica Neue,Arial,sans-serif" role="img" aria-label="Event lifecycle"><title>Event lifecycle</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#536047"/></marker></defs><rect x="30.0" y="30" width="210" height="105" rx="12" fill="#edf0e7"/><text x="48.0" y="60" font-size="13" fill="#536047">01</text><text x="48.0" y="86" font-size="19" fill="#20251e">Draft</text><text x="48.0" y="112" font-size="13" fill="#484e43">Only on organizer’s device</text><path d="M243.0 82H268.3333333333333" stroke="#536047" marker-end="url(#arrow)"/><rect x="273.33333333333337" y="30" width="210" height="105" rx="12" fill="#f6eadc"/><text x="291.33333333333337" y="60" font-size="13" fill="#536047">02</text><text x="291.33333333333337" y="86" font-size="19" fill="#20251e">Invited</text><text x="291.33333333333337" y="112" font-size="13" fill="#484e43">Open pack + verify host</text><path d="M486.33333333333337 82H511.66666666666674" stroke="#536047" marker-end="url(#arrow)"/><rect x="516.6666666666667" y="30" width="210" height="105" rx="12" fill="#edf0e7"/><text x="534.6666666666667" y="60" font-size="13" fill="#536047">03</text><text x="534.6666666666667" y="86" font-size="19" fill="#20251e">Active</text><text x="534.6666666666667" y="112" font-size="13" fill="#484e43">Offline map + latest plan</text><path d="M729.6666666666667 82H755.0000000000001" stroke="#536047" marker-end="url(#arrow)"/><rect x="760.0" y="30" width="210" height="105" rx="12" fill="#e9edf0"/><text x="778.0" y="60" font-size="13" fill="#536047">04</text><text x="778.0" y="86" font-size="19" fill="#20251e">Expired</text><text x="778.0" y="112" font-size="13" fill="#484e43">Hide and purge locally</text><text x="30" y="178" font-size="16" fill="#595959">Expiry limits the app experience. It cannot recall delivered files or prevent a modified client reading them.</text></svg>