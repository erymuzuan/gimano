name: ci
on:
  push:
    branches: [master]
    paths: ["backend/**", "data/moderation/**", "data/tolls/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["backend/**", "data/moderation/**", "data/tolls/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      # Run from backend/ so backend/global.json applies: it selects Microsoft.Testing.Platform,
      # which the .NET 10 SDK requires for `dotnet test` (VSTest mode is no longer supported).
      - name: Test
        working-directory: backend
        run: dotnet test --solution Gimano.slnx -c Release
